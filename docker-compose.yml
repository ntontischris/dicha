# Single-process FastAPI service behind Caddy (automatic HTTPS / Let's Encrypt).
# ⚠️ The app keeps in-memory chat sessions + an in-process thread pool.
#    Run EXACTLY ONE container. Do NOT add replicas or `uvicorn --workers`.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8000
    expose:
      - "8000"            # internal only — Caddy is the public entrypoint
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
